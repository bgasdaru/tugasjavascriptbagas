<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Pengguna</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        .header {
            background: #315f8c;
            color: white;
            padding: 25px 8%;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
        }

        .container {
            width: 84%;
            margin: 30px auto;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-section h2 {
            color: #315f8c;
        }

        .btn-tambah {
            background: #315f8c;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-tambah:hover {
            background: #244a6d;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .card-title {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .total {
            font-size: 32px;
            font-weight: bold;
            color: #315f8c;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        th {
            background: #315f8c;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px 14px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f8fb;
        }

        .btn-hapus {
            background: #dc3545;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-hapus:hover {
            background: #b52a37;
        }

        .footer {
            text-align: center;
            padding: 25px;
            color: #777;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .container {
                width: 94%;
            }

            .top-section {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header {
                padding: 25px 5%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Data Pengguna</h1>
        <p>Website sederhana untuk mengelola data pengguna</p>
    </div>

    <div class="container">

        <div class="top-section">
            <div>
                <h2>Daftar Pengguna</h2>
            </div>

            <button class="btn-tambah" onclick="tambahData()">
                + Tambah 2 Data
            </button>
        </div>

        <div class="card">
            <div class="card-title">
                Total Data Pengguna
            </div>

            <div class="total" id="totalData">
                0
            </div>
        </div>

        <div class="card table-container">

            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Umur</th>
                        <th>Alamat</th>
                        <th>Email</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="tabelData">
                </tbody>
            </table>

        </div>

    </div>

    <div class="footer">
        Tugas Pertemuan 6 JavaScript
    </div>

    <script src="data.js"></script>
    <script src="controller.js"></script>

</body>

</html>
